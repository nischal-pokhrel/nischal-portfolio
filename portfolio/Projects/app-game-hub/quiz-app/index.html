<!DOCTYPE html>
<html>
<head>
<title>Advanced Quiz App</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="quiz-container" id="start-screen">
  <h1>Welcome to the Quiz</h1>
  <button id="start-btn">Start Quiz</button>
</div>

<div class="quiz-container hide" id="quiz-box">
  <div class="top-bar">
    <div id="progress">Question 1 of 10</div>
    <div id="timer">Time: 15</div>
  </div>
  <h2 id="question">Question text</h2>
  <div id="answer-buttons" class="btn-grid"></div>
  <button id="next-btn" class="hide">Next</button>
</div>

<div class="quiz-container hide" id="result-screen">
  <h2>Your Score: <span id="score"></span></h2>
  <button id="restart-btn">Play Again</button>
</div>

<button class="home-button" onclick="goHome()">🏠</button>

<script src="script.js"></script>

</body>
</html>
