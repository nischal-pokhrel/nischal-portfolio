<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV | Nischal Pokhrel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0F0F10; --muted: #5F5F67; --line: #DEDEE1; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #F1F1F0;
      color: var(--ink);
      font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    a { color: inherit; }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 18px 16px 0;
    }
    .toolbar a, .toolbar button {
      padding: 10px 18px;
      border: 1.5px solid var(--ink);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: 600 14px/1 "Instrument Sans", "Segoe UI", system-ui, sans-serif;
      text-decoration: none;
      cursor: pointer;
    }
    .toolbar button { background: var(--ink); color: #fff; }

    .page {
      width: min(820px, 100% - 24px);
      margin: 18px auto 40px;
      padding: clamp(24px, 6vw, 52px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 40px -28px rgba(0, 0, 0, 0.35);
    }

    .head { padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
    .head h1 { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; }
    .head .role { margin-top: 4px; color: var(--muted); font-weight: 500; font-size: 1.05rem; }
    .contact { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; font-size: 0.93rem; }

    section { margin-top: 22px; }
    h2 {
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .item { margin-top: 10px; }
    .item-top { display: flex; justify-content: space-between; gap: 16px; }
    .item h3 { font-size: 1rem; font-weight: 600; }
    .item .when { color: var(--muted); white-space: nowrap; font-size: 0.93rem; }
    .muted { color: var(--muted); }
    .skills li { display: grid; grid-template-columns: 130px 1fr; gap: 12px; margin-top: 4px; }
    .skills strong { font-weight: 600; }

    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; font-size: 12.5px; }
      .toolbar { display: none; }
      .page { width: auto; margin: 0; padding: 0; box-shadow: none; border-radius: 0; }
      a { text-decoration: none; }
      section, .item { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" id="print-btn">Save as PDF</button>
    <a href="index.html">Back to portfolio</a>
  </div>

  <main class="page" id="cv"></main>

  <script src="data.js"></script>
  <script>
    (function () {
      var D = window.PORTFOLIO || {};
      function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function ph(v) { return /YOUR_|XXXX|your\.email/i.test(String(v == null ? '' : v)); }
      function nice(url) { return String(url).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''); }

      document.title = 'CV | ' + (D.name || '');

      var contact = [];
      if (D.email && !ph(D.email)) contact.push('<a href="mailto:' + esc(D.email) + '">' + esc(D.email) + '</a>');
      if (D.phone && !ph(D.phone)) contact.push('<span>' + esc(D.phone) + '</span>');
      (D.socials || []).forEach(function (s) {
        if (s.url && !ph(s.url) && /linkedin|github/i.test(s.name)) {
          contact.push('<a href="' + esc(s.url) + '">' + esc(nice(s.url)) + '</a>');
        }
      });

      var html = '';
      html += '<header class="head"><h1>' + esc(D.name) + '</h1><p class="role">' + esc(D.role) + '</p>' +
        (contact.length ? '<div class="contact">' + contact.join('') + '</div>' : '') + '</header>';

      html += '<section><h2>Profile</h2><p>' + esc(D.intro) + '</p></section>';

      if ((D.education || []).length) {
        html += '<section><h2>Education</h2>' + D.education.map(function (e) {
          return '<div class="item"><h3>' + esc(e.program) + '</h3><p class="muted">' + esc(e.institution) + '</p></div>';
        }).join('') + '</section>';
      }

      if ((D.skills || []).length) {
        html += '<section><h2>Skills</h2><ul class="skills">' + D.skills.map(function (g) {
          return '<li><strong>' + esc(g.group) + '</strong><span>' + (g.items || []).map(esc).join(', ') + '</span></li>';
        }).join('') + '</ul></section>';
      }

      if ((D.projects || []).length) {
        html += '<section><h2>Projects</h2>' + D.projects.map(function (p) {
          return '<div class="item"><div class="item-top"><h3>' + esc(p.title) + '</h3>' +
            (p.note ? '<span class="when">' + esc(p.note) + '</span>' : '') + '</div>' +
            '<p>' + esc(p.blurb) + '</p>' +
            ((p.tags || []).length ? '<p class="muted">' + p.tags.map(esc).join(', ') + '</p>' : '') + '</div>';
        }).join('') + '</section>';
      }

      if ((D.certificates || []).length) {
        html += '<section><h2>Training and certificates</h2>' + D.certificates.map(function (c) {
          return '<div class="item"><div class="item-top"><h3>' + esc(c.title) + '</h3><span class="when">' + esc(c.date) + '</span></div>' +
            '<p class="muted">' + esc(c.issuer) + (c.venue ? ', ' + esc(c.venue) : '') + '</p></div>';
        }).join('') + '</section>';
      }

      document.getElementById('cv').innerHTML = html;
      document.getElementById('print-btn').addEventListener('click', function () { window.print(); });

      if (/[?&]download=1/.test(location.search)) {
        var go = function () { setTimeout(function () { window.print(); }, 500); };
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
      }
    })();
  </script>
</body>
</html>
