{% extends "base.html" %}

{% block title %}Login - Student Course Registration System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">
                <i class="fas fa-sign-in-alt me-2"></i>
                Welcome Back
            </h2>
            <p class="text-muted">Sign in to access your account</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="user_type" class="form-label fw-bold">
                    <i class="fas fa-users me-2"></i>Login As
                </label>
                <select class="form-select" id="user_type" name="user_type" required>
                    <option value="">Select user type</option>
                    <option value="student">Student</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label fw-bold">
                    <i class="fas fa-user me-2"></i>Username
                </label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-bold">
                    <i class="fas fa-lock me-2"></i>Password
                </label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted mb-0">Don't have an account?</p>
            <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">
                <i class="fas fa-user-plus me-1"></i>Register Now
            </a>
        </div>

        <hr class="my-4">

        <div class="text-center">
            <h6 class="fw-bold mb-3">Demo Accounts</h6>
            <div class="row g-2">
                <div class="col-6">
                    <div class="card border-primary">
                        <div class="card-body p-2">
                            <small class="text-primary fw-bold">Student</small><br>
                            <small class="text-muted">john_doe / password123</small>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card border-success">
                        <div class="card-body p-2">
                            <small class="text-success fw-bold">Admin</small><br>
                            <small class="text-muted">admin / admin123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
